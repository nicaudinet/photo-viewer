[package]
name = "photo-viewer"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven photo viewer (Rust + iced rewrite)"

[[bin]]
name = "photo-viewer"
path = "src/main.rs"

[dependencies]
# `image` feature: decode PNG/JPEG into iced image handles.
# `tokio` feature: async runtime for off-thread decode Tasks.
# `lazy` gives the `responsive` widget (width-aware masonry layout in wall view).
iced = { version = "0.14", features = ["image", "tokio", "lazy"] }
# Decode PNG/JPEG to RGBA off the GUI thread (fed into an iced image Handle).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# spawn_blocking for CPU-bound decode; time for the delayed loading indicator
# and the empty-view fallback timer.
tokio = { version = "1", features = ["rt", "time"] }
# Native directory picker (save-favourites destination).
rfd = "0.15"

# macOS "Open With" / double-click: Finder delivers the opened file as an Apple
# Event, not on argv. We register an NSAppleEventManager handler for it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSAppleEventManager",
    "NSAppleEventDescriptor",
    "NSString",
    "NSData",
    "NSURL",
    # Observe NSApplicationDidFinishLaunchingNotification so we install the
    # Apple Event handler *after* AppKit installs (and would otherwise clobber)
    # its own.
    "NSNotification",
    # Pulls the Carbon AEEventClass/AEKeyword types + gated setEventHandler API.
    "objc2-core-services",
] }

[profile.dev]
# iced pulls a big dependency tree; a little opt keeps debug runs snappy.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
