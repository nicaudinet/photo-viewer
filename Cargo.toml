[package]
name = "photo-viewer"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven photo viewer (Rust + iced rewrite)"

[[bin]]
name = "photo-viewer"
path = "src/main.rs"

[dependencies]
# `image` feature: decode PNG/JPEG into iced image handles.
# `tokio` feature: async runtime for off-thread decode Tasks.
# `advanced` exposes `widget::Operation`, used to read the wall's laid-out
# viewport size back into `update` (see gui::wall::measure).
iced = { version = "0.14", features = ["image", "tokio", "advanced"] }
# Decode PNG/JPEG to RGBA off the GUI thread (fed into an iced image Handle).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Direct JPEG decoder for scale-on-decode thumbnails: its `scale()` does the
# IDCT at 1/2/4/8 size, so a 300px thumb skips most of a full-res decode.
jpeg-decoder = "0.3"
# spawn_blocking for CPU-bound decode; time for the delayed loading indicator
# and the empty-view fallback timer.
# `sync` carries the native open panel's answer back to the awaiting Task.
tokio = { version = "1", features = ["rt", "time", "sync"] }
# Native directory picker (save-favourites destination).
rfd = "0.15"
trash = "5.2.6"

# macOS "Open With" / double-click: Finder delivers the opened file as an Apple
# Event, not on argv. We register an NSAppleEventManager handler for it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The open panel's completion handler is an Objective-C block.
block2 = "0.6"
# NSOpenPanel, to warm AppKit's out-of-process panel service at startup and to
# run the open panel itself — rfd's cannot take a file *or* a folder. See
# core::platform::{prewarm_file_dialog, pick_open_target}.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSApplication",
    "NSOpenPanel",
    "NSSavePanel",
    "NSPanel",
    "NSWindow",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSAppleEventManager",
    "NSAppleEventDescriptor",
    "NSString",
    "NSData",
    "NSURL",
    # Observe NSApplicationDidFinishLaunchingNotification so we install the
    # Apple Event handler *after* AppKit installs (and would otherwise clobber)
    # its own.
    "NSNotification",
    # Pulls the Carbon AEEventClass/AEKeyword types + gated setEventHandler API.
    "objc2-core-services",
] }

[profile.dev]
# iced pulls a big dependency tree; a little opt keeps debug runs snappy.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

